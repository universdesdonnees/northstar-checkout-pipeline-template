# The checkout in the namespace prod: 3 copies and the production configuration.
# The pipeline runs "kustomize edit set image" in this folder before each
# deployment, which adds the ECR image and its tag below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../base
  - configmap.yaml
replicas:
  - name: checkout
    count: 3
