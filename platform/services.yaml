# One stable address per environment. Each Service asks AWS for a Network
# Load Balancer. The platform team creates them once, before the first
# deployment, so the pipeline never waits for a new load balancer.
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: prod
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: 8080
